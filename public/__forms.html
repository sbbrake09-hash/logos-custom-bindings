<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Logos Custom Bindings forms</title></head>
  <body>
    <form name="custom-binding-quote" data-netlify="true" netlify-honeypot="bot-field" hidden enctype="multipart/form-data">
      <input type="hidden" name="form-name" value="custom-binding-quote">
      <input type="hidden" name="subject" value="New Logos Custom Bindings quote request">
      <input name="bot-field">
      <input name="first-name"><input name="last-name"><input name="email"><input name="phone"><input name="preferred-contact">
      <input name="project-type"><input name="book-title"><input name="dimensions"><input name="book-source"><textarea name="condition"></textarea>
      <input name="preferred-material"><input name="color-style"><textarea name="personalization"></textarea><input name="deadline">
      <textarea name="project-notes"></textarea><input name="photo" type="file">
    </form>
  </body>
</html>
